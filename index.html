<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Quick Question ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 35px 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
      transition: all 0.3s ease;
    }

    .step {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .step.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #2d3436;
      font-size: 1.55rem;
      margin-bottom: 22px;
      line-height: 1.3;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-group-step1 {
      position: relative;
      min-height: 130px;
    }

    .btn {
      background: #ffffff;
      border: 2px solid #ff7675;
      color: #d63031;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
      box-shadow: 0 4px 10px rgba(255, 118, 117, 0.1);
    }

    .btn:hover {
      background: #ff7675;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 118, 117, 0.25);
    }

    #noBtn {
      position: relative;
      user-select: none;
    }

    input[type="date"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #dfe6e9;
      font-size: 1rem;
      color: #2d3436;
      outline: none;
      margin-bottom: 18px;
    }

    input[type="date"]:focus {
      border-color: #ff7675;
    }

    .summary-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      margin: 20px 0;
      border: 1px dashed #fab1a0;
    }

    .summary-item {
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: #636e72;
    }

    .summary-item:last-child {
      margin-bottom: 0;
    }

    .summary-item strong {
      color: #2d3436;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .badge-date {
      background: #ffeaa7;
      color: #d63031;
    }

    .badge-hangout {
      background: #dfe6e9;
      color: #2d3436;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Step 1: The Question -->
    <div class="step active" id="step1">
      <h1>May I take you out on a date? ✨</h1>
      <div class="btn-group btn-group-step1">
        <button class="btn" id="yesBtn" onclick="handleChoice('isDate', 'Yes', 2)">Yes 🥰</button>
        <button class="btn" id="noBtn" onmouseover="dodgeNo()" onclick="handleChoice('isDate', 'No', 2)">
          No (Just hanging out) 😊
        </button>
      </div>
    </div>

    <!-- Step 2: Date Picker -->
    <div class="step" id="step2">
      <h1>When are you free? 📅</h1>
      <input type="date" id="datePicker" />
      <button class="btn" style="width: 100%" onclick="saveDateAndNext()">Continue</button>
    </div>

    <!-- Step 3: Food Craving -->
    <div class="step" id="step3">
      <h1>What are you craving? 🍽️</h1>
      <div class="btn-group">
        <button class="btn" onclick="handleChoice('food', 'Burgers 🍔', 4)">Burgers 🍔</button>
        <button class="btn" onclick="handleChoice('food', 'Ramen 🍜', 4)">Ramen 🍜</button>
        <button class="btn" onclick="handleChoice('food', 'Pho 🍲', 4)">Pho 🍲</button>
        <button class="btn" onclick="handleChoice('food', 'Surprise me ✨', 4)">Surprise me ✨</button>
      </div>
    </div>

    <!-- Step 4: Activity -->
    <div class="step" id="step4">
      <h1>Anything you want to do? 🎯</h1>
      <div class="btn-group">
        <button class="btn" onclick="handleChoice('activity', 'Arcade 🕹️', 5)">Arcade 🕹️</button>
        <button class="btn" onclick="handleChoice('activity', 'Chill 🍃', 5)">Chill 🍃</button>
        <button class="btn" onclick="handleChoice('activity', 'Movies 🎬', 5)">Movies 🎬</button>
        <button class="btn" onclick="handleChoice('activity', 'Museum 🏛️', 5)">Museum 🏛️</button>
      </div>
    </div>

    <!-- Step 5: Drink Preference -->
    <div class="step" id="step5">
      <h1>Coffee or Matcha? ☕🍵</h1>
      <div class="btn-group">
        <button class="btn" onclick="handleChoice('drink', 'Coffee ☕', 6)">Coffee ☕</button>
        <button class="btn" onclick="handleChoice('drink', 'Matcha 🍵', 6)">Matcha 🍵</button>
      </div>
    </div>

    <!-- Step 6: Pick-up Time -->
    <div class="step" id="step6">
      <h1>What time should I pick you up? 🚗</h1>
      <div class="btn-group">
        <button class="btn" onclick="handleChoice('time', '11:00 AM', 7)">11:00 am</button>
        <button class="btn" onclick="handleChoice('time', '12:00 PM', 7)">12:00 pm</button>
        <button class="btn" onclick="handleChoice('time', '1:00 PM', 7)">1:00 pm</button>
      </div>
    </div>

    <!-- Step 7: Summary -->
    <div class="step" id="step7">
      <div id="finalBadge"></div>
      <h1 id="finalTitle">Summary</h1>

      <div class="summary-card">
        <div class="summary-item"><strong>Date:</strong> <span id="sumDate"></span></div>
        <div class="summary-item"><strong>Food:</strong> <span id="sumFood"></span></div>
        <div class="summary-item"><strong>Activity:</strong> <span id="sumActivity"></span></div>
        <div class="summary-item"><strong>Drink:</strong> <span id="sumDrink"></span></div>
        <div class="summary-item"><strong>Pick-up Time:</strong> <span id="sumTime"></span></div>
      </div>

      <p style="color: #636e72; font-size: 0.9rem;" id="sendingText">Saving our plans...</p>
    </div>
  </div>

  <script>
    // Configuration: Replace with your Formspree endpoint (free at formspree.io)
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/xqpzvkkj";

    const responses = {
      isDate: "",
      date: "",
      food: "",
      activity: "",
      drink: "",
      time: ""
    };

    let dodgeCount = 0;

    function dodgeNo() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      
      dodgeCount++;

      const randomX = (Math.random() - 0.5) * 180;
      const randomY = (Math.random() - 0.5) * 70;

      const newScale = Math.max(0.6, 1 - dodgeCount * 0.08);
      const yesScale = Math.min(1.25, 1 + dodgeCount * 0.05);

      noBtn.style.transform = `translate(${randomX}px, ${randomY}px) scale(${newScale})`;
      yesBtn.style.transform = `scale(${yesScale})`;

      const playfulPhrases = [
        "Are you sure? 🥺",
        "Think again! 😉",
        "Missed me! 🏃‍♂️",
        "Almost! ✨",
        "Just say yes 🥰"
      ];

      if (dodgeCount <= playfulPhrases.length) {
        noBtn.innerText = playfulPhrases[dodgeCount - 1];
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const noBtn = document.getElementById('noBtn');
      if (noBtn) {
        noBtn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          dodgeNo();
        });
      }
    });

    function showStep(stepNumber) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(`step${stepNumber}`).classList.add('active');
    }

    function handleChoice(field, value, nextStep) {
      responses[field] = value;
      if (nextStep === 7) {
        finishAndSend();
      } else {
        showStep(nextStep);
      }
    }

    function saveDateAndNext() {
      const selectedDate = document.getElementById('datePicker').value;
      if (!selectedDate) {
        alert("Please select a date first! 😊");
        return;
      }
      responses.date = selectedDate;
      showStep(3);
    }

    function finishAndSend() {
      showStep(7);

      const isDate = responses.isDate === 'Yes';
      const badgeContainer = document.getElementById('finalBadge');
      const titleContainer = document.getElementById('finalTitle');

      if (isDate) {
        badgeContainer.innerHTML = '<span class="status-badge badge-date">ITS A DATE!! 🎉</span>';
        titleContainer.innerText = "Can't wait! 🥰";
      } else {
        badgeContainer.innerHTML = '<span class="status-badge badge-hangout">W Hangout 🤝</span>';
        titleContainer.innerText = "Sounds like a plan!";
      }

      document.getElementById('sumDate').innerText = responses.date;
      document.getElementById('sumFood').innerText = responses.food;
      document.getElementById('sumActivity').innerText = responses.activity;
      document.getElementById('sumDrink').innerText = responses.drink;
      document.getElementById('sumTime').innerText = responses.time;

      fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(responses)
      })
      .then(response => {
        document.getElementById('sendingText').innerText = "All set! See you then. ✨";
      })
      .catch(error => {
        document.getElementById('sendingText').innerText = "Saved! Take a screenshot and send it to me! 📸";
      });
    }
  </script>
</body>
</html>
